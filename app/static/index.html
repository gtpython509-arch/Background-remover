<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Background Remover</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #272b36; --fg: #e7e9ee;
    --muted: #9aa3b2; --accent: #4f8cff; --err: #ff6b6b; --ok: #3ecf8e;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --fg:#1a1d24; --muted:#5c6473; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  #drop {
    border: 2px dashed var(--line); border-radius: var(--radius); padding: 36px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: rgba(79,140,255,.07); }
  #drop p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: inherit; font-size: 14px;
  }
  button {
    margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .frame {
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 120px;
    display: flex; align-items: center; justify-content: center;
  }
  .checker {
    background-image:
      linear-gradient(45deg, #c9c9c9 25%, transparent 25%, transparent 75%, #c9c9c9 75%),
      linear-gradient(45deg, #c9c9c9 25%, transparent 25%, transparent 75%, #c9c9c9 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px; background-color: #fff;
  }
  img { max-width: 100%; display: block; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 20px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  a.dl { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Background Remover</h1>
  <div class="sub">Local test page for <code>POST /v1/remove</code>. Not meant as your production front-end.</div>

  <div class="panel">
    <div id="drop" tabindex="0" role="button" aria-label="Choose an image">
      <strong>Drop an image here</strong>
      <p>or click to browse &middot; PNG, JPEG, WebP</p>
      <input id="file" type="file" accept="image/*" hidden />
    </div>

    <div class="controls">
      <div>
        <label for="fmt">Output format</label>
        <select id="fmt">
          <option value="png">PNG (transparent)</option>
          <option value="webp">WebP (transparent)</option>
          <option value="jpeg">JPEG (flattened)</option>
          <option value="mask">Mask only</option>
        </select>
      </div>
      <div>
        <label for="bg">Background colour</label>
        <input id="bg" type="text" placeholder="#ffffff or blank" />
      </div>
      <div>
        <label for="feather">Feather (px)</label>
        <input id="feather" type="number" value="0" min="0" max="25" step="0.5" />
      </div>
      <div>
        <label for="contrast">Edge contrast</label>
        <input id="contrast" type="number" value="0" min="0" max="10" step="0.5" />
      </div>
      <div>
        <label for="key">API key (if required)</label>
        <input id="key" type="password" placeholder="X-API-Key" autocomplete="off" />
      </div>
    </div>

    <button id="go" disabled>Remove background</button>
    <div id="msg" class="msg"></div>

    <div class="row">
      <figure>
        <figcaption>Original</figcaption>
        <div class="frame"><img id="before" alt="" /></div>
      </figure>
      <figure>
        <figcaption>Result</figcaption>
        <div class="frame checker"><img id="after" alt="" /></div>
        <a id="dl" class="dl" hidden download>Download result</a>
      </figure>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("file");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var before = document.getElementById("before");
  var after = document.getElementById("after");
  var dl = document.getElementById("dl");
  var chosen = null;
  var resultUrl = null;

  // Remember the key across reloads only; it never leaves this browser.
  try {
    var saved = localStorage.getItem("rmbg_key");
    if (saved) document.getElementById("key").value = saved;
  } catch (e) { /* private mode */ }

  function say(text, cls) {
    msg.textContent = text || "";
    msg.className = "msg" + (cls ? " " + cls : "");
  }

  function pick(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { say("That is not an image file.", "err"); return; }
    chosen = file;
    before.src = URL.createObjectURL(file);
    after.removeAttribute("src");
    dl.hidden = true;
    go.disabled = false;
    say(file.name + " · " + (file.size / 1024).toFixed(0) + " KB");
  }

  drop.addEventListener("click", function () { fileInput.click(); });
  drop.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener("change", function () { pick(fileInput.files[0]); });
  ["dragenter", "dragover"].forEach(function (name) {
    drop.addEventListener(name, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (name) {
    drop.addEventListener(name, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) pick(e.dataTransfer.files[0]);
  });

  go.addEventListener("click", function () {
    if (!chosen) return;
    var key = document.getElementById("key").value.trim();
    try { if (key) localStorage.setItem("rmbg_key", key); } catch (e) {}

    var body = new FormData();
    body.append("file", chosen);
    body.append("output_format", document.getElementById("fmt").value);
    var bg = document.getElementById("bg").value.trim();
    if (bg) body.append("background", bg);
    body.append("feather", document.getElementById("feather").value || "0");
    body.append("edge_contrast", document.getElementById("contrast").value || "0");

    var headers = {};
    if (key) headers["X-API-Key"] = key;

    go.disabled = true;
    say("Processing…");
    var started = Date.now();

    fetch("v1/remove", { method: "POST", body: body, headers: headers })
      .then(function (res) {
        if (!res.ok) {
          return res.json()
            .then(function (j) {
              throw new Error((j.error && j.error.message) || "HTTP " + res.status);
            }, function () { throw new Error("HTTP " + res.status); });
        }
        var serverMs = res.headers.get("X-Inference-Ms");
        return res.blob().then(function (blob) { return { blob: blob, serverMs: serverMs }; });
      })
      .then(function (out) {
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = URL.createObjectURL(out.blob);
        after.src = resultUrl;
        dl.href = resultUrl;
        dl.download = chosen.name.replace(/\.[^.]+$/, "") + "_cutout." +
          (document.getElementById("fmt").value === "jpeg" ? "jpg" : "png");
        dl.hidden = false;
        var total = ((Date.now() - started) / 1000).toFixed(2);
        say("Done in " + total + "s" + (out.serverMs ? " (model " + out.serverMs + "ms)" : ""), "ok");
      })
      .catch(function (err) { say(err.message, "err"); })
      .finally(function () { go.disabled = false; });
  });
})();
</script>
</body>
</html>
