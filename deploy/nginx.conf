# ---------------------------------------------------------------------------
# nginx site for a Hostinger VPS (Ubuntu). Install as:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rmbg
#   sudo ln -sf /etc/nginx/sites-available/rmbg /etc/nginx/sites-enabled/rmbg
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get TLS first (certbot rewrites the server blocks for you):
#   sudo certbot --nginx -d api.yourdomain.com
# Replace api.yourdomain.com everywhere below.
# ---------------------------------------------------------------------------

upstream rmbg_api {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# Second-level defence in depth behind the app's own limiter. 10 req/s with a
# burst of 20 suits a single-VPS deployment; raise it once you know your load.
limit_req_zone $binary_remote_addr zone=rmbg_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=rmbg_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # certbot's ACME challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    # certbot fills these in; the paths below are what it uses by default.
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    # Must be >= RMBG_MAX_UPLOAD_BYTES, or nginx rejects the upload before the
    # app can return its own structured 413.
    client_max_body_size 16m;
    client_body_timeout  60s;
    client_body_buffer_size 1m;

    # Measured on 2 vCPUs: 4096x3072 takes ~3.7s end to end, and inference is
    # a flat ~2s regardless of image size (the net always runs at 1024x1024).
    # 180s is therefore generous head-room for a queued request behind others;
    # it must exceed RMBG_INFERENCE_TIMEOUT_SECONDS or clients get a 504 while
    # the model is still working.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    # Never gzip the image payloads: PNG/WebP/JPEG are already compressed, so
    # it burns CPU for nothing.
    gzip_proxied any;
    gzip_min_length 1024;

    location / {
        limit_req  zone=rmbg_rl burst=20 nodelay;
        limit_conn rmbg_conn 10;

        proxy_pass http://rmbg_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Streaming the response avoids buffering multi-MB PNGs to disk.
        proxy_buffering off;
        proxy_request_buffering on;
    }

    # Keep ops endpoints off the public internet.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://rmbg_api;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://rmbg_api;
    }
}
